<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Memory · Roam</title>
<style>
  :root {
    --bg: #E9EEE9; --card: #FFFFFF;
    --pine: #14524A; --pine-deep: #0C3B35; --pine-soft: #E2EDE9;
    --signal: #E85D2F; --signal-soft: #FCEAE2;
    --ink: #22332F; --ink-mute: #5F6E69; --line: #D4DED8;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --mono: "SFMono-Regular", Consolas, Menlo, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.6; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font-family: inherit; cursor: pointer; }
  a { text-decoration: none; color: inherit; }

  /* 顶栏 */
  .top {
    background: var(--pine-deep); color: #F2F7F4; height: 56px; padding: 0 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .top .back {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #BFD9CF;
    padding: 6px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.18);
  }
  .top .back:hover, .top .back:focus-visible { color: #fff; background: rgba(255,255,255,.08); outline: none; }
  .top .ti { font-weight: 700; letter-spacing: 1px; font-size: 16px; }
  .top .ti em { font-style: normal; color: var(--signal); }
  .top .stats { margin-left: auto; font-family: var(--mono); font-size: 12px; color: #9DBBB2; }
  .top .stats b { color: #fff; }

  /* 主体 */
  .app {
    display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: 16px;
    padding: 16px; height: calc(100dvh - 56px); min-height: 560px; max-width: 1560px; margin: 0 auto;
  }
  @media (max-width: 980px) {
    .app { display: flex; flex-direction: column; height: auto; }
    .map-card { min-height: 60dvh; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; min-height: 0; }

  /* 地图 */
  .map-card { position: relative; overflow: hidden; }
  .map-card svg#china-map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .map-card svg#china-map:active { cursor: grabbing; }
  .zoom-ctl { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .zoom-ctl button {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.95); color: var(--pine); font-family: var(--mono); font-size: 17px; font-weight: 700; line-height: 1;
  }
  .zoom-ctl button:hover, .zoom-ctl button:focus-visible { background: var(--pine-soft); outline: none; }
  .map-tip {
    position: absolute; pointer-events: none; display: none; z-index: 6;
    background: var(--pine-deep); color: #F2F7F4; font-size: 13px; padding: 6px 12px; border-radius: 9px;
    font-family: var(--mono); white-space: nowrap; box-shadow: 0 4px 14px rgba(12,59,53,.25);
  }
  .map-tip small { display: block; color: #9DBBB2; font-size: 11px; }
  .map-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: var(--card); padding: 30px; z-index: 4; }
  .map-msg .t { font-weight: 700; color: var(--pine); }
  .map-msg .s { font-size: 13px; color: var(--ink-mute); margin-top: 4px; max-width: 40ch; }
  .map-msg button { margin-top: 12px; padding: 8px 22px; border: none; border-radius: 10px; background: var(--pine); color: #fff; font-weight: 700; }
  .map-spin { width: 34px; height: 34px; border: 4px solid var(--pine-soft); border-top-color: var(--signal); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .map-note { position: absolute; left: 14px; bottom: 10px; font-size: 11px; color: var(--ink-mute); z-index: 3; }

  /* 地图元素 */
  .prov { stroke: #FFFFFF; stroke-width: 2.2; stroke-linejoin: round; cursor: pointer; transition: filter .15s; }
  .prov.hov { filter: brightness(.94) saturate(1.15); }
  .prov.flash { animation: provflash .5s ease-out 1; }
  @keyframes provflash { 30% { filter: brightness(.85) saturate(1.4); } }
  .jd-line { fill: none; stroke: #7B8F88; stroke-linecap: round; stroke-dasharray: 8 7; opacity: .85; }
  .sea-label { font-family: var(--sans); fill: #8AA098; letter-spacing: 3px; }
  .city-dot { fill: #14524A; opacity: .22; }
  .pin-body { fill: var(--signal); stroke: #fff; stroke-width: 2.6; }
  .pin-core { fill: #fff; pointer-events: none; }
  .pin-g, .city-g { cursor: pointer; }
  .pin-g:hover .pin-body { filter: brightness(1.08); }
  .pin-g.picked .pin-body { animation: pinpop .45s cubic-bezier(.34,1.56,.64,1); transform-box: fill-box; transform-origin: center; }
  @keyframes pinpop { 40% { transform: scale(1.45); } }

  /* 右栏 */
  .side { display: flex; flex-direction: column; overflow: hidden; }
  .side-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .side-title { font-size: 16px; font-weight: 700; color: var(--pine); }
  .side-title em { font-style: normal; color: var(--signal); }
  .side-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .side-body { flex: 1; min-height: 0; overflow-y: auto; }

  .city-rows { display: flex; flex-direction: column; gap: 6px; }
  .city-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: #FBFCFB; border-radius: 10px; padding: 10px 12px;
    transition: border-color .15s, background .15s;
  }
  .city-row:hover, .city-row:focus-visible { border-color: var(--pine); background: var(--pine-soft); outline: none; }
  .city-row .dotm { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); flex-shrink: 0; }
  .city-row .nm { font-weight: 700; font-size: 14px; }
  .city-row .py { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
  .city-row .cnt { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
  .list-pad { padding: 14px 16px 20px; }
  .list-pad h3 { font-size: 12px; font-weight: 700; color: var(--ink-mute); letter-spacing: 1px; margin-bottom: 8px; }

  /* City Memory 空间 */
  .cm-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--pine-soft); flex-shrink: 0; }
  .back-btn { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--pine); font-size: 15px; line-height: 1; }
  .back-btn:hover, .back-btn:focus-visible { color: var(--signal); outline: none; }
  .cm-head .ti { font-size: 17px; font-weight: 700; color: var(--pine); }
  .cm-head .pi { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
  .cm-body { padding: 16px; }
  .cm-meta-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cm-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
  .mark-btn { border: none; background: var(--signal); color: #fff; font-weight: 700; font-size: 12.5px; padding: 7px 16px; border-radius: 9px; margin-left: auto; }
  .mark-btn:hover, .mark-btn:focus-visible { background: #C74820; outline: none; }
  .cm-sec { margin-bottom: 22px; }
  .cm-sec > h4 { font-size: 13px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
  .cm-sec > h4 .n { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); font-weight: 400; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .photo-cell { position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden; background: var(--pine-soft); }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .photo-cell .del {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
    border: none; background: rgba(12,59,53,.7); color: #fff; font-size: 11px; line-height: 1; opacity: 0; transition: opacity .15s;
  }
  .photo-cell:hover .del, .photo-cell .del:focus-visible { opacity: 1; }
  .upload-tile { aspect-ratio: 1; border: 2px dashed var(--line); border-radius: 9px; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--ink-mute); font-size: 11px; text-align: center; cursor: pointer; transition: border-color .15s, color .15s; }
  .upload-tile:hover, .upload-tile:focus-within { border-color: var(--signal); color: var(--signal); }
  .upload-tile .plus { font-size: 20px; line-height: 1; }
  .memo { background: #FBFCFB; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; position: relative; }
  .memo .d { font-family: var(--mono); font-size: 11px; color: var(--signal); }
  .memo .x { position: absolute; top: 6px; right: 8px; border: none; background: none; color: var(--ink-mute); font-size: 12px; opacity: 0; }
  .memo:hover .x, .memo .x:focus-visible { opacity: 1; }
  .memo .tx { font-size: 13px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .memo-form { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .memo-form textarea { width: 100%; font: inherit; font-size: 13px; border: none; resize: vertical; min-height: 58px; color: var(--ink); background: transparent; }
  .memo-form textarea:focus { outline: none; }
  .memo-form .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .memo-form input[type="date"] { font-family: var(--mono); font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #FBFCFB; }
  .memo-form .save { margin-left: auto; padding: 7px 16px; border: none; border-radius: 8px; background: var(--pine); color: #fff; font-weight: 700; font-size: 12.5px; }
  .memo-form .save:hover, .memo-form .save:focus-visible { background: var(--pine-deep); outline: none; }
  .cm-empty { text-align: center; padding: 18px 8px; color: var(--ink-mute); font-size: 12.5px; }
  .cm-empty svg { width: 74px; height: 74px; }
  .unvisit { background: none; border: none; color: var(--ink-mute); font-size: 12px; text-decoration: underline dotted; padding: 0; }
  .unvisit:hover, .unvisit:focus-visible { color: var(--signal); outline: none; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px); z-index: 60;
    background: var(--pine-deep); color: #F2F7F4; padding: 10px 20px; border-radius: 22px; font-size: 14px;
    display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; box-shadow: 0 8px 30px rgba(12,59,53,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .toast button { border: none; background: var(--signal); color: #fff; font-weight: 700; font-size: 13px; padding: 4px 14px; border-radius: 16px; }
  .lightbox { position: fixed; inset: 0; z-index: 70; background: rgba(12,59,53,.88); display: none; place-items: center; cursor: zoom-out; }
  .lightbox.open { display: grid; }
  .lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 10px; }
</style>
</head>
<body>
<h1 class="sr-only">City Memory：中国地图上点开任意城市，存放那一站的照片与所见所闻</h1>

<header class="top">
  <a class="back" href="roam-app.html">← 返回 Roam</a>
  <div class="ti">City <em>Memory</em></div>
  <div class="stats" id="top-stats">已点亮 0 城</div>
</header>

<div class="app">
  <!-- 大地图 -->
  <div class="card map-card">
    <svg id="china-map" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="卡通风格中国地图，每个城市均可点击进入独立空间"></svg>
    <div class="zoom-ctl">
      <button type="button" id="zoom-in" aria-label="放大">+</button>
      <button type="button" id="zoom-out" aria-label="缩小">−</button>
      <button type="button" id="zoom-reset" aria-label="复位" style="font-size:12px">1:1</button>
    </div>
    <div class="map-tip" id="map-tip"></div>
    <div class="map-note">滚轮缩放 · 拖拽漫游 · 双击放大 ｜ 底图：DataV 标准边界（内置，离线可用）· 数据仅存本机</div>
  </div>

  <!-- 右栏：列表 / 城市空间 -->
  <aside class="card side" aria-label="城市列表与记忆空间">
    <!-- 列表 -->
    <div id="list-view" style="display:flex;flex-direction:column;min-height:0;height:100%">
      <div class="side-head">
        <div class="side-title">点亮<em>的城市</em></div>
        <div class="side-sub">点地图上任意城市，进入它的独立空间</div>
      </div>
      <div class="side-body">
        <div class="list-pad">
          <h3>已有记忆的城市</h3>
          <div class="city-rows" id="city-rows"></div>
        </div>
      </div>
    </div>

    <!-- 城市空间 -->
    <div id="memory-view" hidden style="display:flex;flex-direction:column;min-height:0;height:100%">
      <div class="cm-head">
        <button class="back-btn" type="button" id="cm-back" aria-label="返回列表">←</button>
        <div>
          <div class="ti" id="cm-name">城市</div>
          <div class="pi" id="cm-py"></div>
        </div>
      </div>
      <div class="side-body">
        <div class="cm-body">
          <div class="cm-meta-row">
            <div class="cm-meta" id="cm-visited"></div>
            <button class="mark-btn" type="button" id="mark-btn" hidden>点亮足迹</button>
          </div>
          <section class="cm-sec">
            <h4>照片 <span class="n" id="cm-photo-n"></span></h4>
            <div class="photo-grid" id="cm-photos"></div>
            <input type="file" id="photo-input" accept="image/*" multiple hidden>
          </section>
          <section class="cm-sec">
            <h4>所见所闻 <span class="n" id="cm-memo-n"></span></h4>
            <div id="cm-memos"></div>
            <form class="memo-form" id="memo-form">
              <label class="sr-only" for="memo-text">写点什么</label>
              <textarea id="memo-text" placeholder="这一站看到什么、听到什么、吃到什么……"></textarea>
              <div class="row">
                <label class="sr-only" for="memo-date">日期</label>
                <input type="date" id="memo-date">
                <button class="save" type="submit">记下这一笔</button>
              </div>
            </form>
          </section>
          <button class="unvisit" type="button" id="unvisit-btn" hidden>抹掉这座城市的足迹</button>
        </div>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status"><span id="toast-text"></span></div>
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="照片放大查看"></div>

/* ---------- 自绘中国地图 ---------- */
const NS = 'http://www.w3.org/2000/svg';
const VB_W = 1000, VB_H = 900;
const svgEl = document.getElementById('china-map');
const tip = document.getElementById('map-tip');
const PALETTE = ['#DCE9DF', '#F6E3D4', '#DDE7EE', '#F3ECD7', '#E7E0EE', '#D9E8E0'];
let PROJ = null, rootG = null, gProv = null, markerLayer = null;
let view = { k: 1, tx: 0, ty: 0 };

const mk = (name, attrs) => {
  const n = document.createElementNS(NS, name);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
function walkGeom(geom, fn) {
  if (!geom) return;
  switch (geom.type) {
    case 'GeometryCollection': geom.geometries.forEach(g => walkGeom(g, fn)); break;
    case 'Point': fn(geom.coordinates); break;
    case 'MultiPoint': case 'LineString': geom.coordinates.forEach(fn); break;
    case 'MultiLineString': case 'Polygon': geom.coordinates.forEach(r => r.forEach(fn)); break;
    case 'MultiPolygon': geom.coordinates.forEach(p => p.forEach(r => r.forEach(fn))); break;
  }
}
function makeProj(features, w, h, offX, offY) {
  let x1 = Infinity, x2 = -Infinity, y1 = Infinity, y2 = -Infinity;
  features.forEach(f => walkGeom(f.geometry, ([lng, lat]) => {
    const x = lng, y = mercY(lat);
    if (x < x1) x1 = x; if (x > x2) x2 = x;
    if (y < y1) y1 = y; if (y > y2) y2 = y;
  }));
  const s = Math.min(w / (x2 - x1), h / (y2 - y1));
  return (lng, lat) => [offX + (lng - x1) * s, offY + (mercY(lat) - y1) * s];
}
function ringPath(ring, close) {
  let d = '';
  for (let i = 0; i < ring.length; i++) {
    const [x, y] = PROJ(ring[i][0], ring[i][1]);
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return close ? d + 'Z' : d;
}
function featurePath(f) {
  const g = f.geometry; if (!g) return '';
  if (g.type === 'Polygon') return g.coordinates.map(r => ringPath(r, true)).join('');
  if (g.type === 'MultiPolygon') return g.coordinates.map(p => p.map(r => ringPath(r, true)).join('')).join('');
  if (g.type === 'LineString') return ringPath(g.coordinates, false);
  if (g.type === 'MultiLineString') return g.coordinates.map(r => ringPath(r, false)).join('');
  return '';
}

function initMap() {
  /* 底图为内置的 DataV 标准边界（量化+轻度抽稀），离线即可渲染，无需网络 */
  drawMap(JSON.parse(document.getElementById('cn-geo').textContent));
}

function drawMap(geo) {
  svgEl.innerHTML = '';
  const mainland = geo.features.filter(f => f.properties.adcode !== '100000_JD');
  const jd = geo.features.find(f => f.properties.adcode === '100000_JD');
  PROJ = makeProj(mainland, 960, 620, 20, 14);

  const defs = mk('defs');
  defs.innerHTML = '<filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">' +
    '<feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="n"/>' +
    '<feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>';
  svgEl.append(defs);

  rootG = mk('g');
  svgEl.append(rootG);
  gProv = mk('g', { filter: 'url(#wobble)' });
  rootG.append(gProv);

  mainland.forEach((f, i) => {
    const p = mk('path', { class: 'prov', d: featurePath(f), fill: PALETTE[i % PALETTE.length] });
    p.addEventListener('mouseenter', ev => { p.classList.add('hov'); showTip(ev, f.properties.name, '省份'); });
    p.addEventListener('mousemove', moveTip);
    p.addEventListener('mouseleave', () => { p.classList.remove('hov'); hideTip(); });
    p.addEventListener('click', () => { p.classList.remove('flash'); requestAnimationFrame(() => p.classList.add('flash')); });
    gProv.append(p);
  });

  if (jd) {
    rootG.append(mk('path', { class: 'jd-line', d: featurePath(jd), 'stroke-width': 2 }));
    let bx1 = Infinity, bx2 = -Infinity, by1 = Infinity;
    walkGeom(jd.geometry, ([lng, lat]) => {
      const [x, y] = PROJ(lng, lat);
      if (x < bx1) bx1 = x; if (x > bx2) bx2 = x; if (y < by1) by1 = y;
    });
    const lb = mk('text', { class: 'sea-label', x: (bx1 + bx2) / 2, y: by1 - 10, 'text-anchor': 'middle', 'font-size': 15 });
    lb.textContent = '南海诸岛';
    rootG.append(lb);
  }

  markerLayer = mk('g');
  rootG.append(markerLayer);
  view = { k: 1, tx: 0, ty: 0 };
  renderCities();
  applyView();
  setupGestures();
}

function renderCities() {
  if (!markerLayer || !PROJ) return;
  markerLayer.innerHTML = '';
  CITIES.forEach(c => {
    const [x, y] = PROJ(c.lng, c.lat);
    const g = mk('g', { class: visited[c.id] ? 'pin-g' : 'city-g' });
    g.dataset.cx = x; g.dataset.cy = y; g.dataset.city = c.id;
    if (visited[c.id]) {
      g.append(mk('circle', { class: 'pin-body', r: 10 }));
      g.append(mk('circle', { class: 'pin-core', r: 3.6 }));
    } else {
      g.append(mk('circle', { class: 'city-dot', r: 4.2 }));
      g.append(mk('circle', { fill: 'transparent', r: 14 }));
    }
    g.addEventListener('mouseenter', ev => {
      const pc = photoCounts[c.id] || 0, mc = (memos[c.id] || []).length;
      const sub = visited[c.id]
        ? `去过 · ${visited[c.id]} · ${pc} 张照片 ${mc} 笔备忘`
        : '还没去过 · 点进它的空间';
      showTip(ev, c.name, sub);
      if (visited[c.id]) markerLayer.append(g);
    });
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('click', ev => {
      ev.stopPropagation(); hideTip();
      if (visited[c.id]) {
        g.classList.remove('picked');
        requestAnimationFrame(() => g.classList.add('picked'));
      }
      openMemory(c.id);
    });
    markerLayer.append(g);
  });
  applyView();
}

function applyView() {
  if (!rootG) return;
  const k = view.k;
  rootG.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${k})`);
  gProv.querySelectorAll('.prov').forEach(p => p.setAttribute('stroke-width', 2.2 / k));
  const jl = rootG.querySelector('.jd-line'); if (jl) jl.setAttribute('stroke-width', 2 / k);
  const lbl = rootG.querySelector('.sea-label'); if (lbl) lbl.setAttribute('font-size', 15 / k);
  markerLayer.querySelectorAll('g').forEach(g => {
    g.setAttribute('transform', `translate(${g.dataset.cx},${g.dataset.cy}) scale(${1 / k})`);
  });
}

function clientToView(e) {
  const r = svgEl.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * VB_W, (e.clientY - r.top) / r.height * VB_H];
}
function clampView() {
  const k = view.k;
  view.tx = Math.min(0, Math.max(VB_W * (1 - k), view.tx));
  view.ty = Math.min(0, Math.max(VB_H * (1 - k), view.ty));
}
function zoomAt(vx, vy, factor) {
  const k2 = Math.min(8, Math.max(1, view.k * factor));
  const r = k2 / view.k;
  view.tx = vx - (vx - view.tx) * r;
  view.ty = vy - (vy - view.ty) * r;
  view.k = k2;
  clampView(); applyView();
}
function setupGestures() {
  svgEl.addEventListener('wheel', e => {
    e.preventDefault();
    const [vx, vy] = clientToView(e);
    zoomAt(vx, vy, Math.exp(-e.deltaY * 0.0016));
  }, { passive: false });
  let drag = null;
  svgEl.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty };
    try { svgEl.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svgEl.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svgEl.getBoundingClientRect();
    view.tx = drag.tx + (e.clientX - drag.x) / r.width * VB_W;
    view.ty = drag.ty + (e.clientY - drag.y) / r.height * VB_H;
    clampView(); applyView();
  });
  const stop = () => { drag = null; };
  svgEl.addEventListener('pointerup', stop);
  svgEl.addEventListener('pointercancel', stop);
  svgEl.addEventListener('pointerleave', stop);
  svgEl.addEventListener('dblclick', e => { const [vx, vy] = clientToView(e); zoomAt(vx, vy, 1.7); });
}
document.getElementById('zoom-in').addEventListener('click', () => zoomAt(VB_W / 2, VB_H / 2, 1.4));
document.getElementById('zoom-out').addEventListener('click', () => zoomAt(VB_W / 2, VB_H / 2, 1 / 1.4));
document.getElementById('zoom-reset').addEventListener('click', () => { view = { k: 1, tx: 0, ty: 0 }; applyView(); });

function showTip(ev, title, sub) {
  tip.textContent = '';
  tip.append(document.createTextNode(title));
  const s = document.createElement('small'); s.textContent = sub; tip.append(s);
  tip.style.display = 'block';
  moveTip(ev);
}
function moveTip(ev) {
  const wrap = tip.parentElement.getBoundingClientRect();
  const x = Math.min(ev.clientX - wrap.left + 12, wrap.width - 130);
  tip.style.left = Math.max(6, x) + 'px';
  tip.style.top = Math.max(6, ev.clientY - wrap.top - 46) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

function ripple(cityId) {
  const g = markerLayer && markerLayer.querySelector(`[data-city="${cityId}"]`);
  if (!g) return;
  const c = mk('circle', { r: 10, fill: 'none', stroke: '#E85D2F', 'stroke-width': 3 });
  const a1 = mk('animate', { attributeName: 'r', from: 10, to: 44, dur: '0.7s', fill: 'freeze' });
  const a2 = mk('animate', { attributeName: 'opacity', from: 1, to: 0, dur: '0.7s', fill: 'freeze' });
  c.append(a1, a2);
  g.prepend(c);
  setTimeout(() => c.remove(), 800);
}

/* ---------- 统计 + 列表 ---------- */
let photoCounts = {};
async function refreshStats() {
  if (idb) {
    const all = await idbAll();
    photoCounts = {};
    all.forEach(p => { photoCounts[p.city] = (photoCounts[p.city] || 0) + 1; });
  }
  const n = Object.keys(visited).length;
  const totalPhotos = Object.values(photoCounts).reduce((a, b) => a + b, 0);
  const totalMemos = Object.values(memos).reduce((s, a) => s + a.length, 0);
  document.getElementById('top-stats').innerHTML =
    `已点亮 <b>${n}</b> 城 · <b>${totalPhotos}</b> 张照片 · <b>${totalMemos}</b> 笔备忘`;
  renderCityRows();
}
function renderCityRows() {
  const box = document.getElementById('city-rows');
  const rows = Object.keys(visited).map(id => CITY_BY_ID[id]).filter(Boolean)
    .sort((a, b) => visited[b.id] < visited[a.id] ? -1 : 1);
  box.innerHTML = '';
  if (!rows.length) {
    const p = document.createElement('div');
    p.style.cssText = 'font-size:12.5px;color:var(--ink-mute);padding:6px 2px';
    p.textContent = '还没有点亮的城市。点地图上任意城市，先看看，再去过。';
    box.append(p);
    return;
  }
  rows.forEach(c => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'city-row';
    const dot = document.createElement('span'); dot.className = 'dotm';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = c.name;
    const py = document.createElement('span'); py.className = 'py'; py.textContent = c.py;
    const cnt = document.createElement('span'); cnt.className = 'cnt';
    const pc = photoCounts[c.id] || 0, mc = (memos[c.id] || []).length;
    cnt.textContent = `${pc} 张 · ${mc} 笔`;
    btn.append(dot, nm, py, cnt);
    btn.addEventListener('click', () => openMemory(c.id));
    box.append(btn);
  });
}

/* ---------- 城市空间 ---------- */
const listView = document.getElementById('list-view');
const memoryView = document.getElementById('memory-view');
let currentCity = null;
let photoURLs = [];
function openMemory(cityId) {
  currentCity = cityId;
  const c = CITY_BY_ID[cityId];
  document.getElementById('cm-name').textContent = c.name;
  document.getElementById('cm-py').textContent = `${c.py} · ${c.prov}`;
  const isVisited = !!visited[cityId];
  document.getElementById('cm-visited').textContent = isVisited ? `足迹点亮于 ${visited[cityId]}` : '还没点亮足迹';
  document.getElementById('mark-btn').hidden = isVisited;
  document.getElementById('unvisit-btn').hidden = !isVisited;
  document.getElementById('memo-date').value = new Date().toISOString().slice(0, 10);
  listView.hidden = true;
  memoryView.hidden = false;
  renderPhotos(); renderMemos();
  memoryView.querySelector('.side-body').scrollTop = 0;
}
function backToList() {
  memoryView.hidden = true;
  listView.hidden = false;
  currentCity = null;
  photoURLs.forEach(u => URL.revokeObjectURL(u));
  photoURLs = [];
}
document.getElementById('cm-back').addEventListener('click', backToList);

async function renderPhotos() {
  const grid = document.getElementById('cm-photos');
  grid.innerHTML = '';
  const list = idb ? (await idbAll()).filter(p => p.city === currentCity) : [];
  document.getElementById('cm-photo-n').textContent = list.length ? `${list.length} 张` : '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'cm-empty'; empty.style.gridColumn = '1 / -1';
    empty.innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true"><use href="#xm-happy"></use></svg><div>这个空间还是空的，传几张照片亮一亮？</div>';
    grid.append(empty);
  } else {
    list.sort((a, b) => a.date < b.date ? 1 : -1).forEach(p => {
      const url = URL.createObjectURL(p.blob); photoURLs.push(url);
      const cell = document.createElement('div'); cell.className = 'photo-cell';
      const img = document.createElement('img'); img.src = url; img.alt = `照片 · ${p.date}`;
      img.addEventListener('click', () => { lightboxImg.src = url; lightbox.classList.add('open'); });
      const del = document.createElement('button'); del.className = 'del'; del.type = 'button';
      del.textContent = '✕'; del.setAttribute('aria-label', '删除照片');
      del.addEventListener('click', async () => {
        await idbDel(p.id); URL.revokeObjectURL(url);
        renderPhotos(); refreshStats();
      });
      cell.append(img, del); grid.append(cell);
    });
  }
  const up = document.createElement('label');
  up.className = 'upload-tile'; up.htmlFor = 'photo-input';
  const plus = document.createElement('span'); plus.className = 'plus'; plus.textContent = '＋';
  const txt = document.createElement('span'); txt.textContent = '上传照片';
  up.append(plus, txt);
  grid.append(up);
}
document.getElementById('photo-input').addEventListener('change', async ev => {
  const files = Array.from(ev.target.files || []);
  ev.target.value = '';
  if (!files.length) return;
  for (const f of files) {
    await idbPut({ id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())), city: currentCity, date: new Date().toISOString().slice(0, 10), blob: f });
  }
  renderPhotos(); refreshStats();
  toast(`存好了 ${files.length} 张照片`);
});

function renderMemos() {
  const box = document.getElementById('cm-memos');
  box.innerHTML = '';
  const list = memos[currentCity] || [];
  document.getElementById('cm-memo-n').textContent = list.length ? `${list.length} 笔` : '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'cm-empty'; empty.textContent = '这一站还没写字，第一笔最珍贵。';
    box.append(empty);
  }
  [...list].sort((a, b) => a.date < b.date ? 1 : -1).forEach(m => {
    const card = document.createElement('div'); card.className = 'memo';
    const x = document.createElement('button'); x.className = 'x'; x.type = 'button';
    x.textContent = '✕'; x.setAttribute('aria-label', '删除这条备忘');
    x.addEventListener('click', () => {
      memos[currentCity] = memos[currentCity].filter(v => v.id !== m.id);
      lsSet(LS_MEMOS, memos);
      renderMemos(); refreshStats();
    });
    const d = document.createElement('div'); d.className = 'd'; d.textContent = m.date;
    const tx = document.createElement('div'); tx.className = 'tx'; tx.textContent = m.text;
    card.append(x, d, tx); box.append(card);
  });
}
document.getElementById('memo-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const textEl = document.getElementById('memo-text');
  const text = textEl.value.trim();
  if (!text) { toast('先写点什么再存吧'); return; }
  const date = document.getElementById('memo-date').value || new Date().toISOString().slice(0, 10);
  memos[currentCity] = memos[currentCity] || [];
  memos[currentCity].push({ id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), date, text });
  lsSet(LS_MEMOS, memos);
  textEl.value = '';
  renderMemos(); refreshStats();
  toast('记下了 ✓');
});
document.getElementById('mark-btn').addEventListener('click', () => {
  if (!currentCity) return;
  visited[currentCity] = new Date().toISOString().slice(0, 10);
  lsSet(LS_VISITED, visited);
  renderCities(); refreshStats(); ripple(currentCity);
  toast(`${CITY_BY_ID[currentCity].name} 点亮了`);
  openMemory(currentCity);
});
document.getElementById('unvisit-btn').addEventListener('click', () => {
  const c = CITY_BY_ID[currentCity];
  if (confirm(`抹掉「${c.name}」的足迹？照片和备忘会留在本地，只是地图上不再点亮。`)) {
    delete visited[currentCity];
    lsSet(LS_VISITED, visited);
    renderCities(); refreshStats(); backToList();
    toast(`已抹掉「${c.name}」的足迹`);
  }
});

/* ---------- 启动 ---------- */
initMap();
openIDB().then(db => { idb = db; refreshStats(); }).catch(() => refreshStats());
refreshStats();
</script>
